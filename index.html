<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>800 · SAT Math Trainer</title>
<meta name="description" content="Adaptive SAT Math practice built on 1,039 verified official questions.">
<meta name="theme-color" content="#0f1222">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot__mark">800</div>
  <div class="boot__msg">Loading question bank…</div>
</div>

<header class="topbar" hidden>
  <button class="topbar__brand" data-nav="home" type="button">
    <span class="topbar__mark">800</span>
    <span class="topbar__name">SAT Math Trainer</span>
  </button>
  <div class="topbar__stats">
    <div class="stat" title="Day streak">
      <span class="stat__icon" aria-hidden="true">◆</span>
      <span class="stat__val" data-bind="streak">0</span>
    </div>
    <div class="stat" title="Total XP">
      <span class="stat__icon" aria-hidden="true">✦</span>
      <span class="stat__val" data-bind="xp">0</span>
    </div>
    <div class="stat stat--score" title="Estimated Math score">
      <span class="stat__val" data-bind="score">—</span>
    </div>
  </div>
  <button class="topbar__theme" data-action="theme" type="button" aria-label="Toggle theme">◐</button>
</header>

<main id="view" class="view" hidden></main>

<nav class="tabbar" hidden>
  <button data-nav="home" type="button"><span aria-hidden="true">◈</span>Home</button>
  <button data-nav="practice" type="button"><span aria-hidden="true">▶</span>Practice</button>
  <button data-nav="progress" type="button"><span aria-hidden="true">▤</span>Progress</button>
  <button data-nav="awards" type="button"><span aria-hidden="true">✷</span>Awards</button>
</nav>

<div id="calc" class="calc" hidden>
  <div class="calc__bar">
    <span>Graphing calculator</span>
    <button data-action="calc-close" type="button" aria-label="Close calculator">✕</button>
  </div>
  <div id="calc-host" class="calc__host"></div>
  <p class="calc__fallback">Calculator unavailable offline.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="data/bank.js"></script>
<script src="assets/js/math.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/generate.js"></script>
<script src="assets/js/bank.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
